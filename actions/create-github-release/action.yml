name: Create GitHub Release
description: Checks out the repository, updates the changelog for a tag, commits the changelog, and creates a GitHub release.

inputs:
  version_tag:
    description: Release tag, for example v1.2.3.
    required: true
  github_token:
    description: Token used for checkout, changelog push, and release creation.
    required: true
  release_name:
    description: Release name. Defaults to Release <tag>.
    required: false
    default: ''
  changelog_path:
    description: Path to the changelog file.
    required: false
    default: CHANGELOG.md
  release_body_path:
    description: Path to write extracted release notes.
    required: false
    default: release-body.md
  target_branch:
    description: Branch that receives the changelog commit.
    required: false
    default: main
  commit_message:
    description: Commit message used for the changelog update.
    required: false
    default: ''
  git_user_name:
    description: Git author name.
    required: false
    default: github-actions[bot]
  git_user_email:
    description: Git author email.
    required: false
    default: github-actions[bot]@users.noreply.github.com
  ignore_commit_errors:
    description: Continue even if the changelog commit or push fails.
    required: false
    default: 'true'
  version_tag_pattern:
    description: Regex that version_tag must match. Guards against releasing a branch name such as "main".
    required: false
    default: '^v[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?$'

outputs:
  release_body_path:
    description: Path to the extracted release notes file.
    value: ${{ steps.prepare.outputs.release_body_path }}

runs:
  using: composite
  steps:
    # Runs before checkout/changelog/commit so a bad tag fails before anything is mutated.
    # A caller passing ${{ github.ref_name }} from a non-tag ref yields a branch name such
    # as "main", which would otherwise cut a "main" tag/release and roll the curated
    # Unreleased changelog section into a release that does not exist.
    - name: Validate version tag
      shell: bash
      env:
        VERSION_TAG: ${{ inputs.version_tag }}
        VERSION_TAG_PATTERN: ${{ inputs.version_tag_pattern }}
      run: |
        set -euo pipefail

        if [ -z "$VERSION_TAG" ]; then
          echo "::error::version_tag is empty."
          exit 1
        fi

        if ! printf '%s' "$VERSION_TAG" | grep -qE "$VERSION_TAG_PATTERN"; then
          echo "::error::version_tag '$VERSION_TAG' does not look like a version tag (expected to match: $VERSION_TAG_PATTERN)."
          echo "::error::If that is a branch name, the calling workflow is passing \${{ github.ref_name }} on a non-tag ref. Gate the release job with: if: startsWith(github.ref, 'refs/tags/')"
          exit 1
        fi

        echo "version_tag '$VERSION_TAG' validated."

    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0
        token: ${{ inputs.github_token }}

    - name: Prepare changelog
      id: prepare
      uses: lukaszmn/gh-actions/actions/prepare-release-changelog@v1
      with:
        version_tag: ${{ inputs.version_tag }}
        changelog_path: ${{ inputs.changelog_path }}
        release_body_path: ${{ inputs.release_body_path }}

    - name: Commit changelog update
      continue-on-error: ${{ inputs.ignore_commit_errors == 'true' }}
      uses: lukaszmn/gh-actions/actions/commit-file-changes@v1
      with:
        files: ${{ inputs.changelog_path }}
        commit_message: "${{ inputs.commit_message != '' && inputs.commit_message || format('chore: update CHANGELOG for {0} [skip ci]', inputs.version_tag) }}"
        target_branch: ${{ inputs.target_branch }}
        git_user_name: ${{ inputs.git_user_name }}
        git_user_email: ${{ inputs.git_user_email }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        tag_name: ${{ inputs.version_tag }}
        name: ${{ inputs.release_name != '' && inputs.release_name || format('Release {0}', inputs.version_tag) }}
        body_path: ${{ steps.prepare.outputs.release_body_path }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
